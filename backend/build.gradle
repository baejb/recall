plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.recall'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 멀티유저 SSO 로그인(OAuth2) — 틀만 배선. 실제 인증/인가 로직은 후속(팀원).
	// oauth2-client 는 spring-security 를 전이 의존으로 끌어온다.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// llm-eval 태그는 실제 provider 를 호출한다(API 키 필요·비용 발생·비결정적) → 기본 test 와 CI 에서 제외.
	// PR 마다 돌리면 진짜 회귀가 아닌 이유로(모델 출력 변동) 빨개지고, 그 소음이 게이트를 무력화한다.
	useJUnitPlatform {
		excludeTags 'llm-eval'
	}
}

// 🔵 LLM 품질 Eval 만 실행: ./gradlew llmEval
// 실제 provider 를 호출해 단계별 품질을 라벨셋으로 채점한다(PRD §7 — C 유형 라우팅·S2 추출·S4 판정).
// 프롬프트를 고친 직후에 사람이 돌린다. 키는 env 로: RECALL_LLM_PROVIDER·RECALL_LLM_API_KEY·RECALL_LLM_MODEL_STRONG.
// 키가 없으면 각 테스트가 assumption 으로 스킵된다(실패가 아니라 "안 돌았음"으로 드러난다).
tasks.register('llmEval', Test) {
	description = 'LLM 품질 Eval(🔵) — 실제 provider 호출. 키 없으면 스킵'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'llm-eval'
	}
	// 모델 응답을 그대로 봐야 채점 결과를 해석할 수 있다.
	testLogging {
		showStandardStreams = true
		events 'passed', 'skipped', 'failed'
	}
	outputs.upToDateWhen { false } // 같은 입력이어도 모델 출력이 달라지므로 캐시하지 않는다.
}

// 🔴 릴리스 차단 게이트만 실행: ./gradlew releaseGate
// PRD 치명 회귀 — 민감정보 유출(마스킹 잔존 0)·충돌 자동 덮어쓰기·근거 없는 생성·멀티유저 교차유출.
// @Tag("release-gate") 붙은 테스트만 돌린다(DB 필요한 케이스 포함).
tasks.register('releaseGate', Test) {
	description = '릴리스 차단 게이트(🔴) 회귀 테스트만 실행'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'release-gate'
	}
}

// 기존 코드가 4칸 들여쓰기이므로 google-java-format 의 AOSP(4칸) 스타일로 맞춘다.
// 포맷 검사: ./gradlew spotlessCheck   ·   자동 정리: ./gradlew spotlessApply
spotless {
	java {
		googleJavaFormat('1.28.0').aosp()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
