spring:
  application:
    name: recall
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recall}
    username: ${SPRING_DATASOURCE_USERNAME:recall}
    password: ${SPRING_DATASOURCE_PASSWORD:recall}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  docker:
    compose:
      enabled: false          # DB is provided by the root docker-compose.yml

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

recall:
  llm:
    embedding:
      api-key: ${VOYAGE_API_KEY:}          # 비면 stub 임베딩(벡터 검색 무의미)
      model: voyage-3
      base-url: https://api.voyageai.com/v1
      dimension: 1024                       # memory_embedding vector(N)과 일치해야 함
