spring:
  application:
    name: recall
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/recall}
    username: ${SPRING_DATASOURCE_USERNAME:recall}
    password: ${SPRING_DATASOURCE_PASSWORD:recall}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  docker:
    compose:
      enabled: false          # DB is provided by the root docker-compose.yml
  # ── 멀티유저 SSO: Google OAuth2 로그인 (틀만) ────────────────────────────────
  # 실제 인증/인가 로직은 후속(팀원)이 SecurityConfig 에서 배선한다.
  # 아래 블록은 client-id/secret 이 비면 ClientRegistrationRepository 생성이 실패하므로
  # 주석 상태로 둔다 — env 를 채운 뒤 주석을 해제한다.
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
  #           client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  #           scope: openid, email, profile

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

recall:
  security:
    secret-key: ${RECALL_SECRET_KEY:}
  llm:
    provider: ${RECALL_LLM_PROVIDER:anthropic}   # anthropic | openai | google
    api-key: ${RECALL_LLM_API_KEY:}              # 비면 stub LLM(추출·판정이 fallback)
    model: ${RECALL_LLM_MODEL_STRONG:claude-opus-4-8}
    base-url: ${RECALL_LLM_BASE_URL:}            # 비면 provider 기본 URL
    max-tokens: 4096
    embedding:
      provider: ${RECALL_EMBEDDING_PROVIDER:voyage}   # voyage | openai
      api-key: ${RECALL_EMBEDDING_API_KEY:${VOYAGE_API_KEY:}}   # 비면 stub 임베딩(벡터 검색 무의미)
      model: ${RECALL_EMBEDDING_MODEL:}     # 비면 provider별 기본(voyage-3 / text-embedding-3-small)
      base-url: ${RECALL_EMBEDDING_BASE_URL:}   # 비면 provider별 기본 URL
      dimension: 1024                       # memory_embedding vector(N)과 일치해야 함(openai는 dimensions로 맞춤)
