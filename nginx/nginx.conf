# Host reverse proxy (nginx runs on the host, not in Docker).
# Serves the built SPA and forwards backend paths to the locally running backend.
server {
    listen 80;
    server_name _;

    # API → backend (proxy_buffering off keeps SSE streaming)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
    }

    # OAuth 로그인 시작 → backend.
    # 이 규칙이 없으면 아래 SPA fallback 의 try_files 가 이 주소를 index.html 로 삼켜, 로그인 버튼이
    # 백엔드에 닿지 못한다(화면만 다시 그려지고 에러가 없다).
    location /oauth2/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Google 콜백(/login/oauth2/code/*) → backend.
    # 🔴 이 규칙이 빠지면 동의 화면을 통과한 뒤 돌아온 authorization code 를 nginx 가 SPA HTML 로
    # 삼킨다. 백엔드에 닿지 않으므로 세션이 만들어지지 않고, 증상은 "로그인했는데 로그인 화면"이다.
    # Host·X-Forwarded-* 를 넘기는 이유: 스프링이 이 값으로 redirect_uri 를 만든다 — 어긋나면
    # Google 이 redirect_uri_mismatch 로 거절한다.
    location /login/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA fallback — point root at the `npm run build` output (frontend/dist)
    location / {
        root /var/www/recall;   # e.g. copy frontend/dist here on deploy
        try_files $uri /index.html;
    }
}
